name: 功能建议
description: 为 Audio-CPM 提出可执行的功能或体验改进
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景和当前不便之处，再提出方案。涉及播放链路、音频输出、存储结构或打包方式的大改动，建议先讨论再实现。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前在什么场景下不方便？影响多大？
      placeholder: 例如：整理大量专辑时，目标目录切换太频繁
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你希望看到的行为或界面
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 目前如何绕过？为什么不够好？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 工作台 / 浮窗 / 场景
        - 文件浏览 / 收藏 / 目标目录
        - 播放 / 音频输出 / EQ
        - 元数据 / 标签
        - 批处理 / 格式转换
        - 多语言 / 界面文案
        - Android 打包 / 权限
        - 其他
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: 参考图或草图
      description: 可拖入截图；请勿包含隐私信息
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue，确认不是重复建议
          required: true
