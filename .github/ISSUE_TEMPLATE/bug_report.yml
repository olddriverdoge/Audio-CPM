name: Bug 报告
description: 报告可复现的 Audio-CPM 问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 Issue，并尽量提供可复现步骤和日志。
        安全问题请不要使用本表单，按 [SECURITY.md](https://github.com/olddriverdoge/Audio-CPM/blob/main/SECURITY.md) 私密报告。

  - type: input
    id: summary
    attributes:
      label: 问题摘要
      description: 一句话说明发生了什么
      placeholder: 例如：删除当前播放文件后播放器仍卡顿
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: 版本
      options:
        - 0.4.33
        - main 分支构建
        - 其他版本 / 不确定
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装来源
      options:
        - GitHub Release APK
        - 自建 / CI artifact
        - 源码运行（Termux / PC）
        - 其他
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 手机型号、Android 版本、ROM；桌面模式请写系统与浏览器
      placeholder: 例如：Pixel 7 / Android 15 / 官方 ROM
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序写出最小复现步骤
      placeholder: |
        1. 打开...
        2. 选择...
        3. 点击...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      validations:
        required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志、截图或录屏
      description: 可粘贴日志浮窗内容；请先删除个人路径、WebDAV 地址和凭据
      placeholder: 粘贴必要日志，或拖入截图/录屏
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue，确认不是重复问题
          required: true
        - label: 我已删除日志和截图中的敏感信息（凭据、私密地址、文件内容）
          required: true
