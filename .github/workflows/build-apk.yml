name: build-apk

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Cache buildozer / gradle / android
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.android
          key: p4a-${{ hashFiles('packaging/p4a/buildozer.spec') }}

      - name: Build APK
        working-directory: packaging/p4a
        run: |
          buildozer -v android debug 2>&1 | tee build.log || true
          test -f bin/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-cpm-apk
          path: packaging/p4a/bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: packaging/p4a/build.log
