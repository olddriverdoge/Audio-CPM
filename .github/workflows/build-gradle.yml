name: build-audio-cpm

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "构建已签名的 release APK / AAB（需要 release secrets）"
        required: false
        type: boolean
        default: false
      main_package:
        description: "用主干包名构建 debug APK（用于迁移正式版本机数据；不会写入 debug-latest）"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

jobs:
  # ---------------------------------------------------------------- FFmpeg
  # 独立作业：NDK 编译音频专用 ffmpeg（静态单文件），产出 libffmpegbin.so。
  # 命中缓存时约 1 分钟，冷构建约 15~25 分钟。
  ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "ndk;27.0.12077973"
          ls -d "$ANDROID_HOME"/ndk/*

      - name: Cache ffmpeg output
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: packaging/android/ffmpeg/out
          key: ffmpeg-8.0.1-arm64-${{ hashFiles('packaging/android/ffmpeg/build_ffmpeg_android.sh') }}

      - name: Build ffmpeg (arm64, audio-only)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          chmod +x packaging/android/ffmpeg/build_ffmpeg_android.sh
          packaging/android/ffmpeg/build_ffmpeg_android.sh

      - name: Verify ffmpeg components
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          SRC=/tmp/ffmpeg-build/ffmpeg-8.0.1
          for c in FLAC_ENCODER AAC_ENCODER ALAC_ENCODER PCM_S16LE_ENCODER MJPEG_ENCODER FLAC_DECODER MP3_DECODER APE_DECODER DSD_LSBF_DECODER MJPEG_DECODER PNG_DECODER MOV_DEMUXER FLAC_MUXER IPOD_MUXER IMAGE2_MUXER ARESAMPLE_FILTER SCALE_FILTER AAC_ADTSTOASC_BSF; do
            v=$(grep -E "^#define CONFIG_${c} " "$SRC/config_components.h" | awk '{print $3}')
            echo "$c = ${v:-MISSING}"
            if [ "${v:-0}" != "1" ]; then echo "!! 组件缺失: $c" >&2; exit 1; fi
          done

      - name: Show ffmpeg artifact
        run: |
          ls -l packaging/android/ffmpeg/out/libffmpegbin.so
          file packaging/android/ffmpeg/out/libffmpegbin.so

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-arm64
          path: packaging/android/ffmpeg/out/libffmpegbin.so

  # ---------------------------------------------------------------- APK / AAB
  build:
    needs: ffmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Android SDK 35
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Download ffmpeg binary
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-android-arm64
          path: packaging/android/app/src/main/jniLibs/arm64-v8a

      - name: Show jniLibs
        run: ls -l packaging/android/app/src/main/jniLibs/arm64-v8a/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # 发布构建需要 4 个仓库 secrets：
      # AC2_RELEASE_KEYSTORE_BASE64 / AC2_RELEASE_STORE_PASSWORD
      # AC2_RELEASE_KEY_ALIAS / AC2_RELEASE_KEY_PASSWORD
      - name: Prepare release keystore
        if: ${{ github.ref_type == 'tag' || github.event.inputs.build_release == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.AC2_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AC2_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AC2_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AC2_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少 release signing secret: $name"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/audiocpm-release.p12"
          chmod 600 "$RUNNER_TEMP/audiocpm-release.p12"
          {
            echo "AC2_RELEASE_KEYSTORE=$RUNNER_TEMP/audiocpm-release.p12"
            echo "AC2_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "AC2_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "AC2_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        if: ${{ github.ref_type != 'tag' && github.event.inputs.build_release != 'true' }}
        working-directory: packaging/android
        env:
          AC2_FORCE_STABLE_PACKAGE: ${{ github.event.inputs.main_package }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify debug APK package name
        if: ${{ github.ref_type != 'tag' && github.event.inputs.build_release != 'true' }}
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK="packaging/android/app/build/outputs/apk/debug/Audio-CPM-debug.apk"
          ACTUAL=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          if [ "${{ github.event.inputs.main_package }}" = "true" ]; then
            EXPECTED="com.github.olddriverdoge.audiocpm"
          else
            EXPECTED="com.github.olddriverdoge.audiocpm.dev"
          fi
          echo "debug package: $ACTUAL (expected $EXPECTED)"
          test "$ACTUAL" = "$EXPECTED"

      - name: Build signed release APK + AAB
        if: ${{ github.ref_type == 'tag' || github.event.inputs.build_release == 'true' }}
        working-directory: packaging/android
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify release signatures
        if: ${{ github.ref_type == 'tag' || github.event.inputs.build_release == 'true' }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs packaging/android/app/build/outputs/apk/release/Audio-CPM-release.apk
          jarsigner -verify packaging/android/app/build/outputs/bundle/release/Audio-CPM-release.aab | tail -3

      - name: Verify release APK package name
        if: ${{ github.ref_type == 'tag' || github.event.inputs.build_release == 'true' }}
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK="packaging/android/app/build/outputs/apk/release/Audio-CPM-release.apk"
          ACTUAL=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          EXPECTED="com.github.olddriverdoge.audiocpm"
          echo "release package: $ACTUAL (expected $EXPECTED)"
          test "$ACTUAL" = "$EXPECTED"

      - uses: actions/upload-artifact@v4
        if: ${{ github.ref_type != 'tag' && github.event.inputs.build_release != 'true' }}
        with:
          name: audio-cpm-apk
          path: packaging/android/app/build/outputs/apk/debug/*.apk

      - name: Publish debug build to debug-latest
        if: ${{ github.ref_type != 'tag' && github.event.inputs.build_release != 'true' && github.event.inputs.main_package != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' packaging/android/app/build.gradle.kts | head -1)
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' packaging/android/app/build.gradle.kts | head -1)
          test -n "$VERSION" -a -n "$CODE"
          SRC="packaging/android/app/build/outputs/apk/debug/Audio-CPM-debug.apk"
          ASSET="Audio-CPM-${VERSION}-${CODE}-debug.apk"
          test -f "$SRC"
          cp "$SRC" "$ASSET"
          NOTES="测试通道最新 Action 构建：${VERSION} / versionCode ${CODE}。正式版请使用 GitHub Release。"
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release upload debug-latest "$ASSET" --clobber
            gh release edit debug-latest --prerelease --title "Audio-CPM debug ${VERSION} (${CODE})" --notes "$NOTES"
          else
            gh release create debug-latest "$ASSET" --prerelease --title "Audio-CPM debug ${VERSION} (${CODE})" --notes "$NOTES"
          fi
          echo "published debug-latest asset: $ASSET"


      - uses: actions/upload-artifact@v4
        if: ${{ github.ref_type == 'tag' || github.event.inputs.build_release == 'true' }}
        with:
          name: audio-cpm-release
          path: |
            packaging/android/app/build/outputs/apk/release/Audio-CPM-release.apk
            packaging/android/app/build/outputs/bundle/release/Audio-CPM-release.aab
